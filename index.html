<!DOCTYPE html>
<html lang="ar" dir="rtl">  
<head>  
<meta charset="utf-8">  
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">  
<title>دعوة فرح محمد & أسماء</title>  
<style>  
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Amiri:wght@400;700&display=swap');  

* { box-sizing: border-box; }
body { margin: 0; background: #f9e8ec; color: #7c4856; font-family: Cairo, Arial, sans-serif; }  

.page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: radial-gradient(circle at 20% 20%, #fff 0 4%, transparent 18%),  
                linear-gradient(135deg, #f9dfe6, #fff7f8 48%, #f4d2db);
}  

.card {
    width: min(430px, 100%);
    min-height: 720px;
    position: relative;
    overflow: hidden;
    border-radius: 28px;  
    background: linear-gradient(180deg, #fff8f9, #f9e2e8);
    box-shadow: 0 18px 55px #9b617344;
    padding: 28px 20px;
}  

.petal {
    position: absolute;
    width: 12px;
    height: 20px;
    background: #eaa7b8;
    border-radius: 80% 20% 80% 20%;
    opacity: .35;
    transform: rotate(35deg);
}  

.p1 { top: 12%; left: 8%; }
.p2 { top: 30%; right: 5%; transform: rotate(-25deg); }
.p3 { bottom: 18%; left: 6%; transform: rotate(60deg); }
.p4 { bottom: 8%; right: 10%; transform: rotate(-10deg); }  

.screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 30px;
    transition: opacity .8s, transform .8s;
}  

#openScreen { background: linear-gradient(180deg, #f7dbe3, #fff6f7); z-index: 5; }  

.envelope {
    width: 280px;
    height: 190px;
    position: relative;
    margin-bottom: 25px;
    filter: drop-shadow(0 12px 16px #7d4c5b33);
    cursor: pointer;
}  

.envbody { position: absolute; inset: 0; background: #f5cdd8; border: 2px solid #d99aab; border-radius: 8px; }  
.flap {
    position: absolute;
    top: 0; left: 0;
    width: 0; height: 0;
    border-left: 140px solid transparent;
    border-right: 140px solid transparent;
    border-top: 95px solid #efbdca;
    transform-origin: top;
    transition: transform 1s;
    z-index: 2;
}  

.seal {
    position: absolute;
    z-index: 3;
    left: 50%; top: 70px;
    transform: translateX(-50%);
    width: 54px; height: 54px;
    border-radius: 50%;
    background: #c8899a;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 25px;
}  

.envelope.open .flap { transform: rotateX(180deg); }  

.openbtn {
    border: 0;
    border-radius: 999px;
    padding: 13px 28px;
    background: #c87991;
    color: #fff;
    font: 600 16px Cairo;
    box-shadow: 0 8px 20px #c8799140;
    cursor: pointer;
}  

.hidden { opacity: 0; pointer-events: none; transform: scale(.97); }  
#main { position: relative; z-index: 2; overflow: auto; }  
.kicker { font-size: 14px; letter-spacing: 1px; margin-top: 6px; }  
.names { font-family: Amiri, serif; font-size: 54px; color: #b45f78; line-height: 1.15; margin: 10px 0; }  
.amp { font-family: serif; color: #d092a3; }  
.divider { width: 90px; height: 1px; background: #d99aab; margin: 12px auto 22px; position: relative; }  
.divider:after {
    content: "♥";
    position: absolute;
    left: 50%; top: -13px;
    transform: translateX(-50%);
    background: #fff0f3;
    padding: 0 8px;
    color: #c87991;
}  

.section {
    background: #ffffffb8;
    border: 1px solid #edc4ce;
    border-radius: 22px;
    padding: 18px;
    margin: 14px 0;
    box-shadow: 0 8px 25px #a65c7120;
}  

.child { width: 100%; border-radius: 18px; display: block; object-fit: cover; box-shadow: 0 7px 18px #75404b25; }  
.caption { font-family: Amiri, serif; font-size: 23px; margin: 10px 0; color: #a5576e; }  

.details { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }  
.detail b { display: block; font-size: 13px; margin-bottom: 4px; color: #a45a70; } 
.detail span { font-size: 13px; color: #6e4c55; }  

.map {
    display: block;
    text-decoration: none;
    background: #c87991;
    color: #fff;
    padding: 12px;
    border-radius: 999px;
    margin-top: 14px;
}  

.close { font-family: Amiri, serif; font-size: 24px; color: #a5576e; margin: 18px 0 3px; }  
@media(max-height:760px) { .card { min-height: 650px; } .names { font-size: 46px; } }  
</style>  
</head>  
<body>  
<div class="page">  
  <div class="card">  
    <span class="petal p1"></span><span class="petal p2"></span><span class="petal p3"></span><span class="petal p4"></span>  
    
    <section id="openScreen" class="screen">  
      <div class="kicker">دعــــوة خــــاصة</div>  
      <div class="envelope" id="env" aria-label="فتح الدعوة">  
        <div class="envbody"></div><div class="flap"></div><div class="seal">♥</div>  
      </div>  
      <h2 style="font-family:Amiri,serif;font-weight:700;margin:4px 0 6px">محمد & أسماء</h2>  
      <p style="margin:0 0 18px">اضغط لفتح الدعوة 💗</p>  
      <button class="openbtn" id="openBtn">افتح الدعوة</button>  
    </section>  

    <main id="main" class="screen hidden" style="justify-content:flex-start;text-align:center">  
      <div class="kicker">بكل الحب ندعوكم لحضور حفل زفاف</div>  
      <div class="names">محمد <span class="amp">&</span> أسماء</div>  
      <div class="divider"></div>  

      <div class="section">  
        <div class="caption">من طفولتنا... إلى أن كبر حلمنا</div>  
        <img class="child" src="data:image/jpeg;base64,...أدخل_نص_الصورة_هنا..." alt="صورة الزفاف">  
      </div>  

      <!-- قسم التفاصيل المعدل -->
      <div class="section">
        <div class="details">
          <div class="detail">
            <b>اليوم</b>
            <span>السبت</span>
          </div>
          <div class="detail">
            <b>التاريخ</b>
            <span>29 / 8</span>
          </div>
          <div class="detail">
            <b>الساعة</b>
            <span>9:00 مساءً</span>
          </div>
        </div>
        <a href="https://maps.google.com" target="_blank" class="map">📍 قاعة ريفيرا (اضغط للموقع)</a>
      </div>

      <div class="close">عقبال عندكم جميعاً 🌸</div>
    </main>  
  </div>  
</div>  

<script>
  const openBtn = document.getElementById('openBtn');
  const env = document.getElementById('env');
  const openScreen = document.getElementById('openScreen');
  const main = document.getElementById('main');

  openBtn.addEventListener('click', () => {
    env.classList.add('open');
    setTimeout(() => {
      openScreen.classList.add('hidden');
      main.classList.remove('hidden');
    }, 800);
  });
</script>
</body>  
</html>
