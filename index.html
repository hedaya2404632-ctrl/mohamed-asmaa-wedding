<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة زفاف محمد وأسماء 💗</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Amiri', serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
            overflow-x: hidden;
        }
        .container {
            width: 90%;
            max-width: 450px;
            background: #ffffff;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
            position: relative;
            border: 2px solid #f3e5f5;
        }
        h1, h2 {
            font-family: 'Reem Kufi', sans-serif;
            color: #8e24aa;
            margin-bottom: 15px;
        }
        .names {
            font-size: 2rem;
            margin: 15px 0;
            color: #4a148c;
        }
        .names span {
            color: #e91e63;
        }
        .quote {
            font-style: italic;
            color: #666;
            margin: 15px 0;
            font-size: 1.1rem;
        }
        .img-box {
            width: 100%;
            max-width: 250px;
            height: 250px;
            margin: 20px auto;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid #f8bbd0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }
        .img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(45deg, #8e24aa, #e91e63);
            color: #fff;
            padding: 12px 25px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 15px;
            box-shadow: 0 4px 12px rgba(233, 30, 99, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            border: none;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(233, 30, 99, 0.4);
        }
        /* Envelope Screen */
        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff;
            z-index: 999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        .heart {
            font-size: 3rem;
            color: #e91e63;
            animation: pulse 1.2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- الموسيقى الخاصة بالدعوة -->
    <audio id="myAudio" src="wedding-music.mp3" loop></audio>

    <!-- شاشة الفتح الأولية -->
    <div id="overlay" onclick="openInvitation()">
        <div class="heart">♥</div>
        <h2>دعوة خاصة</h2>
        <p style="font-size:1.2rem; color:#555;">اضغط لفتح الدعوة 💗</p>
    </div>

    <!-- محتوى الدعوة -->
    <div class="container">
        <div>بكل الحب ندعوكم لحضور حفل زفاف</div>
        <div class="names">محمد <span>&amp;</span> أسماء</div>
        
        <div class="quote">"من طفولتنا... إلى أن كبر حلمنا"</div>

        <div class="img-box">
            <!-- الصورة الحالية موصولة بالـ Base64 -->
            <img alt="صورة الزفاف" src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9YWVogAAAAAAAA9tYAAQAAAADTLXBhcmEAAAAAAAQAAAACZmYAAPKnAAANWQAAE9AAAApbAAAAAAAAAABtbHVjAAAAAAAAAAEAAAAMZW5VUwAAACAAAAAcAEcAbwBvAGcAbABlACAASQBuAGMALgAgADIAMAAxADb/2wBDAAMCAgMCAgMDAwMEAwMEBQgFBQQEBQoHBwYIDAoMDAsKCwsNDhIQDQ4RDgsLEBYQERMUFRUVDA8XGBYUGBIUFRT/2wBDAQMEBAUEBQkFBQkUDQsNFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBT/wAARCAYAA2ADASIAAhEBAxEB/8QAHQAAAQQDAQEAAAAAAAAAAAAAAgABAwQFBgcICf/EAE0QAAEDAgUCBAQEAwYEBAQDCQEAAgMEEQUGEiExB0ETIlFhCBQycSNCgZEVUqEWJDNiscEJQ3LRF4Lh8FOSsvElNESisxgmVGNlc4T/xAAcAQEAAwEBAQEBAAAAAAAAAAAAAQIDBAUGBwj/xAAvEQACAgIDAAEEAQMEAgMBAAAAAQIRAyEEEjFBBRMiUTIUM2EGFSNxQoEkQ8Gh/9oAD0prop=" />
        </div>

        <p style="margin-top: 15px; font-size: 1.1rem; line-height: 1.6;">
            يسعدنا حضوركم وتشريفكم لنكتمل بوجودكم فرحتنا.
        </p>

        <!-- رابط اللوكيشن المعمول صح -->
        <a class="btn" href="https://maps.app.goo.gl/hA82sB78g1qJitXQ7" target="_blank">
            موقع الحفل 📍
        </a>
    </div>

    <script>
        function openInvitation() {
            var audio = document.getElementById("myAudio");
            audio.play().catch(function(error) {
                console.log("Audio play failed: ", error);
            });
            document.getElementById("overlay").style.display = "none";
        }
    </script>
</body>
</html>
