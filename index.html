<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#d79b9b">
<title>دعوة زفاف محمد وأسماء</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#ead0cc;min-height:100%;font-family:Arial,"Tahoma",sans-serif}
body{display:flex;justify-content:center;overflow-x:hidden}
.app{width:100%;max-width:700px;position:relative;min-height:100vh;perspective:1200px;overflow:hidden}
.page{position:relative;width:100%;display:none}
.page.active{display:block}
.page img{display:block;width:100%;height:auto}
.hit{position:absolute;border:0;background:transparent;cursor:pointer;z-index:8;-webkit-tap-highlight-color:transparent}
.open-hit{left:14.5%;right:14.5%;top:65%;height:7.5%}
.map-hit{left:25%;right:22%;top:79%;height:4.8%}
.music-hit{left:21%;right:18%;top:85.2%;height:6.5%}

/* حركة فتح الدعوة */
#cover.opening{
  display:block;
  transform-origin:top center;
  animation:coverOpen 1.15s cubic-bezier(.7,0,.2,1) forwards;
  z-index:4;
}
#invitation.reveal{
  display:block;
  animation:invitationReveal 1.15s cubic-bezier(.2,.8,.2,1) forwards;
}
@keyframes coverOpen{
  0%{opacity:1;transform:rotateX(0deg) scale(1) translateY(0);filter:brightness(1)}
  45%{transform:rotateX(-10deg) scale(.98) translateY(-2%);filter:brightness(1.03)}
  100%{opacity:0;transform:rotateX(-78deg) scale(.88) translateY(-18%);filter:brightness(1.08)}
}
@keyframes invitationReveal{
  0%{opacity:0;transform:translateY(24%) scale(.96)}
  45%{opacity:1;transform:translateY(8%) scale(.985)}
  100%{opacity:1;transform:translateY(0) scale(1)}
}

/* لمعة خفيفة أثناء الفتح */
.sparkles{position:absolute;inset:0;pointer-events:none;z-index:7;opacity:0}
.sparkles.show{animation:sparkleFade 1.25s ease-out forwards}
.sparkles i{
  position:absolute;width:6px;height:6px;border-radius:50%;
  background:rgba(255,255,255,.95);box-shadow:0 0 12px 4px rgba(255,220,220,.8);
  animation:twinkle .9s ease-in-out infinite alternate
}
.sparkles i:nth-child(1){left:20%;top:35%}
.sparkles i:nth-child(2){left:75%;top:25%;animation-delay:.15s}
.sparkles i:nth-child(3){left:32%;top:58%;animation-delay:.3s}
.sparkles i:nth-child(4){left:82%;top:65%;animation-delay:.1s}
.sparkles i:nth-child(5){left:50%;top:42%;animation-delay:.4s}
@keyframes sparkleFade{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
@keyframes twinkle{from{transform:scale(.5);opacity:.45}to{transform:scale(1.5);opacity:1}}

.hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(120,70,70,.72);color:#fff;padding:7px 14px;border-radius:20px;font-size:12px;z-index:20;opacity:0;pointer-events:none;transition:.3s}
.hint.show{opacity:1}
.back{position:fixed;top:12px;right:12px;z-index:20;border:0;border-radius:50%;width:38px;height:38px;background:rgba(255,255,255,.72);color:#8f5e5e;font-size:20px;display:none}
@media(min-width:701px){body{padding:18px 0}.app{box-shadow:0 10px 40px rgba(80,40,40,.22)}}
</style>
</head>
<body>
<main class="app">
  <section id="cover" class="page active">
    <img src="cover.png" alt="غلاف دعوة زفاف محمد وأسماء">
    <button class="hit open-hit" aria-label="اضغط لفتح الدعوة" onclick="openInvitation()"></button>
    <div id="sparkles" class="sparkles" aria-hidden="true">
      <i></i><i></i><i></i><i></i><i></i>
    </div>
  </section>

  <section id="invitation" class="page">
    <img src="invitation.png" alt="تفاصيل دعوة زفاف محمد وأسماء">
    <button class="hit map-hit" aria-label="فتح الموقع" onclick="openMap()"></button>
    <button class="hit music-hit" aria-label="تشغيل أو إيقاف الموسيقى" onclick="toggleMusic()"></button>
  </section>
</main>

<button id="back" class="back" onclick="goBack()" aria-label="العودة">‹</button>
<div id="hint" class="hint"></div>
<audio id="music" src="romantic-guitar.wav" loop preload="auto"></audio>

<script>
const music=document.getElementById('music');
const hint=document.getElementById('hint');

function openInvitation(){
  const cover=document.getElementById('cover');
  const invitation=document.getElementById('invitation');
  const sparkles=document.getElementById('sparkles');

  cover.classList.remove('active');
  cover.classList.add('opening');
  invitation.classList.add('reveal');
  sparkles.classList.add('show');
  document.getElementById('back').style.display='block';

  music.play().then(()=>showHint('🎸 الموسيقى الرومانسية اشتغلت'))
    .catch(()=>showHint('اضغطي على زر الموسيقى لتشغيلها'));

  setTimeout(()=>{
    cover.style.display='none';
    invitation.style.display='block';
  },1150);
}

function toggleMusic(){
  if(music.paused){music.play();showHint('🎸 الموسيقى تعمل الآن')}
  else{music.pause();showHint('الموسيقى متوقفة')}
}

function openMap(){
  window.open('https://www.google.com/maps/search/?api=1&query=Riviera+Hall%2C+Hihya%2C+Sharqia%2C+Egypt','_blank');
}

function goBack(){
  const cover=document.getElementById('cover');
  const invitation=document.getElementById('invitation');
  const sparkles=document.getElementById('sparkles');

  invitation.className='page';
  cover.className='page active';
  cover.style.display='';
  invitation.style.display='none';
  sparkles.classList.remove('show');
  document.getElementById('back').style.display='none';
}

function showHint(text){
  hint.textContent=text;
  hint.classList.add('show');
  clearTimeout(window.ht);
  window.ht=setTimeout(()=>hint.classList.remove('show'),1800);
}
</script>
</body>
</html>
